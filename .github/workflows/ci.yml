name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "docs/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RDKIT_FIXTURE_PIP_VERSION: "2026.3.1"

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Rust tests
        run: cargo test --lib
      - name: Run South Star 2 Rust tests
        run: cargo test -p grimace-south-star2 --lib

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-python-rust
        with:
          python-version: "3.12"
          source-tree-test-env: "true"
          install-z3: "true"
      - name: Run South Star source-tree semantics suite
        run: make test-south-star1-fast PYTHON="$GRIMACE_CI_PYTHON"

  south-star1-slow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-python-rust
        with:
          python-version: "3.12"
          source-tree-test-env: "true"
          install-z3: "true"
      - name: Run South Star coupled qualification shards
        run: make test-south-star1-slow PYTHON="$GRIMACE_CI_PYTHON"

  rdkit-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-python-rust
        with:
          python-version: "3.12"
          source-tree-test-env: "true"
      - name: Verify pinned RDKit upstream source fixtures
        run: env -u CONDA_PREFIX "$GRIMACE_CI_PYTHON" -m unittest tests.contract.test_rdkit_upstream_sources -q
      - name: Run pinned RDKit parity suite
        run: env -u CONDA_PREFIX "$GRIMACE_CI_PYTHON" -m unittest tests.run_pinned_rdkit_parity -q
      - name: Run bounded South Star 2 exact support
        run: env -u CONDA_PREFIX "$GRIMACE_CI_PYTHON" -m unittest tests.run_south_star2_rdkit_exact_support -q
      - name: Run South Star 2 source evidence for installed RDKit
        run: env -u CONDA_PREFIX "$GRIMACE_CI_PYTHON" -m tests.run_pinned_stereo_evidence
      - name: Run public prefix contract
        run: env -u CONDA_PREFIX "$GRIMACE_CI_PYTHON" -m unittest tests.integration.test_public_prefix_api -q
      - name: Run South Star 2 bridge and preparation regressions
        run: env -u CONDA_PREFIX "$GRIMACE_CI_PYTHON" -m unittest tests.south_star2.test_native_bridge tests.south_star2.test_preparation tests.south_star2.test_preparation_semantics -q

  exact-public-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-python-rust
        with:
          python-version: "3.12"
          source-tree-test-env: "true"
      - name: Run exact public invariant suite
        run: env -u CONDA_PREFIX "$GRIMACE_CI_PYTHON" -m unittest tests.run_exact_public_invariants -q

  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-python-rust
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build tools
        run: python -m pip install --upgrade pip maturin twine
      - name: Install pinned RDKit fixture version
        run: python -m pip install "rdkit==$RDKIT_FIXTURE_PIP_VERSION"
      - name: Build wheel
        run: maturin build --release --out dist -i python${{ matrix.python-version }}
      - name: Check distribution metadata
        run: python -m twine check dist/*.whl
      - name: Install built wheel
        run: python -m pip install dist/*.whl
      - name: Run installed-package correctness subset
        run: python -m unittest tests.run_installed_package_correctness -q
      - name: Test installed South Star 2 gates with RDKit 2026.03.4
        if: ${{ matrix.python-version == '3.12' }}
        run: |
          python -m pip install --upgrade --force-reinstall "rdkit==2026.3.4"
          python -m pip check
          python - <<'PY'
          from importlib.metadata import version
          from pathlib import Path
          import site

          from rdkit import rdBase
          import grimace
          import grimace.decoding
          import grimace._core

          assert rdBase.rdkitVersion == "2026.03.4", rdBase.rdkitVersion
          print("RDKit runtime:", rdBase.rdkitVersion)
          print("RDKit distribution:", version("rdkit"))
          site_roots = tuple(Path(path).resolve() for path in site.getsitepackages())
          for module in (grimace, grimace.decoding, grimace._core):
              module_path = Path(module.__file__).resolve()
              assert any(module_path.is_relative_to(root) for root in site_roots), module_path
              print(f"{module.__name__}: {module_path}")
          PY
          python -m unittest tests.integration.test_public_prefix_api tests.run_south_star2_rdkit_exact_support tests.south_star2.test_preparation tests.south_star2.test_preparation_semantics.SouthStar2PreparationSemanticTests -q
          python -m tests.run_pinned_stereo_evidence

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-python-rust
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade pip maturin twine
      - name: Install pinned RDKit fixture version
        run: python -m pip install "rdkit==$RDKIT_FIXTURE_PIP_VERSION"
      - name: Build source distribution
        run: maturin build --release --sdist --out dist -i python3.12
      - name: Check source distribution metadata
        run: python -m twine check dist/*.tar.gz
      - name: Install built source distribution
        run: python -m pip install dist/*.tar.gz
      - name: Run installed-package correctness subset from source distribution
        run: python -m unittest tests.run_installed_package_correctness -q
      - name: Test installed South Star 2 gates with RDKit 2026.03.4
        run: |
          python -m pip install --upgrade --force-reinstall "rdkit==2026.3.4"
          python -m pip check
          python - <<'PY'
          from importlib.metadata import version
          from pathlib import Path
          import site

          from rdkit import rdBase
          import grimace
          import grimace.decoding
          import grimace._core

          assert rdBase.rdkitVersion == "2026.03.4", rdBase.rdkitVersion
          print("RDKit runtime:", rdBase.rdkitVersion)
          print("RDKit distribution:", version("rdkit"))
          site_roots = tuple(Path(path).resolve() for path in site.getsitepackages())
          for module in (grimace, grimace.decoding, grimace._core):
              module_path = Path(module.__file__).resolve()
              assert any(module_path.is_relative_to(root) for root in site_roots), module_path
              print(f"{module.__name__}: {module_path}")
          PY
          python -m unittest tests.integration.test_public_prefix_api tests.run_south_star2_rdkit_exact_support tests.south_star2.test_preparation tests.south_star2.test_preparation_semantics.SouthStar2PreparationSemanticTests -q
          python -m tests.run_pinned_stereo_evidence
