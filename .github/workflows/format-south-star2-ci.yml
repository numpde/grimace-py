name: Format temporary South Star 2 projection

on:
  push:
    branches:
      - south-star-2-ci

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: south-star-2-ci
      - name: Install pinned rustfmt
        run: rustup component add rustfmt
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Commit formatted projection
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rust/south_star2/src
          git commit -m "Format temporary South Star 2 projection"
          git push origin HEAD:south-star-2-ci
