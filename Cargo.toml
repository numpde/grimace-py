[package]
name = "grimace-kernel"
version = "0.1.10"
description = "Rust core for the grimace Python package."
edition = "2021"
rust-version = "1.83"
license = "PolyForm-Noncommercial-1.0.0"
homepage = "https://github.com/numpde/grimace-py"
repository = "https://github.com/numpde/grimace-py"
documentation = "https://github.com/numpde/grimace-py/tree/main/docs"

[features]
default = []
python-extension = ["pyo3/extension-module"]

[lib]
name = "_core"
crate-type = ["cdylib"]
path = "rust/src/lib.rs"

[dependencies]
pyo3 = { version = "0.28.2", features = ["num-bigint"] }
num-bigint = "0.4.6"
num-traits = "0.2.19"
serde_json = "1.0.145"
sha2 = "0.10.9"
rustc-hash = "2.1.1"

[workspace]
members = ["rust/south_star2"]
resolver = "2"
